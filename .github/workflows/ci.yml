name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Set executable permissions
        run: find . -name "*.sh" -exec chmod +x {} +

      - name: ShellCheck
        run: |
          find . -name "*.sh" -exec shellcheck {} + || echo "ShellCheck warnings found (non-blocking)"

      - name: Check YAML syntax
        run: |
          if command -v yamllint &>/dev/null; then
            find . -name "*.yml" -o -name "*.yaml" | xargs yamllint -d "{extends: default, rules: {line-length: disable}}" || true
          else
            pip install yamllint -q && find . -name "*.yml" -o -name "*.yaml" | xargs yamllint -d "{extends: default, rules: {line-length: disable}}" || true
          fi

      - name: Validate SKILL.md frontmatter
        run: |
          errors=0
          while IFS= read -r -d '' skill; do
            name=$(head -10 "$skill" | grep -E '^name:\s+' | head -1 || true)
            desc=$(head -10 "$skill" | grep -E '^description:\s+' | head -1 || true)
            dir=$(basename "$(dirname "$skill")")
            if [ -z "$name" ]; then echo "MISSING name: $skill"; errors=$((errors+1)); fi
            if [ -z "$desc" ]; then echo "MISSING description: $skill"; errors=$((errors+1)); fi
            echo "  OK: $dir"
          done < <(find . -name SKILL.md -print0)
          [ "$errors" -eq 0 ] || exit 1

  skill-tests:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Set executable permissions
        run: find . -name "*.sh" -exec chmod +x {} +
      - name: Run skill tests
        run: bash tests/run-skill-tests.sh
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/reports/
          if-no-files-found: ignore

  orchestrator-demo:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Set executable permissions
        run: find . -name "*.sh" -exec chmod +x {} +
      - name: Run orchestrator demo
        run: bash scripts/run-orchestrator.sh threat-model "Demo CI App"
      - name: Verify output
        run: |
          if [ -f artifacts/reports/stride-model.md ]; then
            echo "stride-model.md created successfully"
          else
            echo "WARNING: artifacts/reports/stride-model.md not found"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-artifacts
          path: artifacts/reports/
          if-no-files-found: ignore

  build:
    needs: [lint, skill-tests, orchestrator-demo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          LINT="${{ needs.lint.result }}"
          TESTS="${{ needs.skill-tests.result }}"
          ORCH="${{ needs.orchestrator-demo.result }}"
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| lint | $LINT |"
            echo "| skill-tests | $TESTS |"
            echo "| orchestrator-demo | $ORCH |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$LINT" != "success" ] || [ "$TESTS" != "success" ] || [ "$ORCH" != "success" ]; then
            echo "Some jobs failed. Check logs above."
            exit 1
          fi
          echo "All CI jobs passed!"