name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          find . -name "*.sh" -exec shellcheck {} +
      - name: Check executable permissions
        run: |
          while IFS= read -r -d '' f; do
            [ -x "$f" ] || { echo "NOT EXECUTABLE: $f"; exit 1; }
          done < <(find . -name "*.sh" -print0)
      - name: Check YAML syntax
        run: |
          if command -v yamllint &>/dev/null; then
            find . -name "*.yml" -o -name "*.yaml" | xargs yamllint -d "{extends: default, rules: {line-length: disable}}"
          else
            pip install yamllint -q && find . -name "*.yml" -o -name "*.yaml" | xargs yamllint -d "{extends: default, rules: {line-length: disable}}"
          fi
      - name: Validate SKILL.md frontmatter
        run: |
          errors=0
          while IFS= read -r -d '' skill; do
            name=$(head -10 "$skill" | grep -E '^name:\s+' | head -1 || true)
            desc=$(head -10 "$skill" | grep -E '^description:\s+' | head -1 || true)
            if [ -z "$name" ]; then echo "MISSING name: $skill"; errors=$((errors+1)); fi
            if [ -z "$desc" ]; then echo "MISSING description: $skill"; errors=$((errors+1)); fi
            echo "  OK: $(basename $(dirname $skill))"
          done < <(find . -name SKILL.md -print0)
          [ "$errors" -eq 0 ] || exit 1

  skill-tests:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run skill tests
        run: bash superpowers/tests/claude-code/run-skill-tests.sh
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/reports/
          if-no-files-found: ignore

  orchestrator-demo:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run orchestrator demo
        run: bash scripts/run-orchestrator.sh threat-model "Demo CI App"
      - name: Verify output
        run: |
          if [ -f artifacts/reports/stride-model.md ]; then
            echo "stride-model.md created successfully"
          else
            echo "WARNING: artifacts/reports/stride-model.md not found"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-artifacts
          path: artifacts/reports/
          if-no-files-found: ignore

  build:
    needs: [lint, skill-tests, orchestrator-demo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          failed=0
          for job in lint skill-tests orchestrator-demo; do
            status="${{ needs.$job.result }}"
            echo "| $job | $status |" >> $GITHUB_STEP_SUMMARY
            if [ "$status" != "success" ]; then
              failed=$((failed+1))
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Upstream failures: $failed**" >> $GITHUB_STEP_SUMMARY
          if [ "$failed" -gt 0 ]; then
            echo "Some upstream jobs failed."
          fi
