[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersec-superpowers"
version = "0.1.1"
description = "Enterprise-grade cybersecurity orchestration platform — STRIDE threat modeling, OWASP secure coding, SAST, pentest plans, incident response playbooks, and SBOM supply-chain security as composable agent skills"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rohit Barui", email = "rohit.barui@example.com"}]
requires-python = ">=3.8"
keywords = ["cybersecurity", "devsecops", "threat-modeling", "secure-coding", "incident-response", "sast", "sbom", "owasp"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Unix Shell",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/rohit-barui/CyberSecurity-Superpowers"
Repository = "https://github.com/rohit-barui/CyberSecurity-Superpowers"
Documentation = "https://github.com/rohit-barui/CyberSecurity-Superpowers#readme"
Issues = "https://github.com/rohit-barui/CyberSecurity-Superpowers/issues"

[project.scripts]
cybersec = "cybersec_superpowers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cybersec_superpowers = ["VERSION"]